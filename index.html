<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" id="viewport-meta" content="width=device-width, initial-scale=1.0">
<script>
/* Some Android browsers ignore the viewport meta tag when a file is opened
   locally (e.g. content://downloads/... from the Downloads app) and default
   to a wide ~980px desktop layout instead of the real screen width. Force
   the correct width using the physical screen size as soon as possible. */
(function(){
  /* Some in-app/file viewers (e.g. opening via content://downloads/...)
     ignore viewport-meta changes made after parse, so the layout viewport
     stays "wide" and CSS @media queries never switch to mobile mode even
     though the physical screen is narrow. To be safe regardless of that,
     we ALSO measure the real screen width with JS and toggle plain classes
     on <html> (is-mobile / is-tablet-down). CSS rules keyed off those
     classes work unconditionally, with no dependency on media queries or
     the viewport meta tag being respected. */
  function fixLayout(){
    var w = (window.screen && window.screen.width) ? window.screen.width : window.innerWidth;
    if(!w || w < 200) return;
    var meta = document.getElementById('viewport-meta');
    if(meta) meta.setAttribute('content', 'width=' + w + ', initial-scale=1.0, maximum-scale=1.0');
    var root = document.documentElement;
    root.classList.toggle('is-mobile', w <= 700);
    root.classList.toggle('is-tablet-down', w <= 1100);
  }
  fixLayout();
  document.addEventListener('DOMContentLoaded', fixLayout);
  window.addEventListener('orientationchange', fixLayout);
  window.addEventListener('resize', fixLayout);
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root, html[data-theme="light"]{
  /* palette from reference: #001B48 #02457A #018ABE #97CADB #D6E8EE */
  --p-navy:#001B48;
  --p-navy2:#02457A;
  --p-teal:#018ABE;
  --p-blue:#97CADB;
  --p-pale:#D6E8EE;

  --bg-grad: linear-gradient(160deg, var(--p-pale), var(--p-blue) 120%);
  --navy:#001B48;
  --navy-2:#02457A;
  --teal:#018ABE;
  --teal-dark:#02457A;
  --mint-bg:rgba(1,138,190,.14); --mint-ic:#018ABE;
  --coral-bg:rgba(217,119,87,.16); --coral-ic:#D97757;
  --blue-bg:rgba(151,202,219,.35); --blue-ic:#02457A;
  --gold-bg:rgba(185,138,30,.16); --gold-ic:#B98A1E;
  --line:rgba(2,69,122,.14);
  --muted:#3E6C93;
  --white:#FFFFFF;
  --danger:#D65C4A;
  --menu-bg:#FFFFFF;

  --card-bg: rgba(255,255,255,.5);
  --card-border: rgba(255,255,255,.65);
  --card-blur: blur(18px) saturate(160%);
  --bg-2: rgba(255,255,255,.4);
  --sidebar-grad: linear-gradient(180deg, var(--p-navy), var(--p-navy2));
  --sidebar-ink: #EAF3FA;
  --sidebar-muted: #9FC0DC;
  --nav-active-bg: rgba(255,255,255,.16);
  --nav-active-border: rgba(255,255,255,.28);
  --chart-a:#02457A; --chart-b:#018ABE; --chart-c:#D97757; --chart-d:#0B5750;
}
html[data-theme="dark"]{
  --bg-grad: linear-gradient(135deg, var(--p-navy), #3E6C9C);
  --navy:#EAF3FA;
  --navy-2:#D6E8EE;
  --teal:#97CADB;
  --teal-dark:#D6E8EE;
  --mint-bg:rgba(151,202,219,.18); --mint-ic:#BEE0EE;
  --coral-bg:rgba(217,119,87,.22); --coral-ic:#F0A98D;
  --blue-bg:rgba(151,202,219,.16); --blue-ic:#D6E8EE;
  --gold-bg:rgba(233,193,90,.2); --gold-ic:#F0D28C;
  --line:rgba(255,255,255,.16);
  --muted:#B9D4E8;
  --white:#0E2A4A;
  --danger:#F0A98D;
  --menu-bg:#123560;

  --card-bg: rgba(255,255,255,.07);
  --card-border: rgba(255,255,255,.16);
  --card-blur: blur(18px) saturate(140%);
  --bg-2: rgba(255,255,255,.06);
  --sidebar-grad: linear-gradient(180deg, #00101F, var(--p-navy2));
  --sidebar-ink: #EAF3FA;
  --sidebar-muted: #8FB4D4;
  --nav-active-bg: rgba(255,255,255,.12);
  --nav-active-border: rgba(255,255,255,.22);
  --chart-a:#97CADB; --chart-b:#D6E8EE; --chart-c:#F0A98D; --chart-d:#BEE0EE;
}
.frost{background:var(--card-bg);border:1px solid var(--card-border);-webkit-backdrop-filter:var(--card-blur);backdrop-filter:var(--card-blur);}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{font-family:'Cairo',sans-serif;background:var(--bg-grad);background-attachment:fixed;color:var(--navy);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s;}
html[dir="ltr"] body{font-family:'Poppins','Cairo',sans-serif;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--mint-bg);border-radius:8px;}

/* ---------- Auth ---------- */
#auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg-grad);padding:24px;}
.auth-card{background:var(--card-bg);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);width:100%;max-width:420px;border-radius:22px;padding:36px 32px;box-shadow:0 25px 70px -25px rgba(0,27,72,.45);border:1px solid var(--card-border);}
.auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.auth-logo .dot{width:14px;height:14px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 5px var(--mint-bg);}
.auth-logo span{font-weight:800;font-size:20px;color:var(--navy);}
.auth-sub{color:var(--muted);font-size:14px;margin-bottom:24px;}
.tabbar{display:flex;background:var(--bg-2);border-radius:12px;padding:4px;margin-bottom:22px;}
.tabbar button{flex:1;border:none;background:transparent;padding:10px;border-radius:9px;font-weight:700;color:var(--muted);font-size:14px;}
.tabbar button.active{background:var(--card-bg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--teal-dark);box-shadow:0 2px 8px rgba(0,0,0,.08);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;font-weight:700;color:var(--navy);margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;background:var(--bg-2);outline:none;transition:.15s;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);background:rgba(255,255,255,.6);}
.btn-primary{width:100%;padding:12px;border:none;border-radius:10px;background:var(--teal-dark);color:#fff;font-weight:800;font-size:15px;transition:.15s;}
.btn-primary:hover{background:var(--navy-2);}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;}
.auth-error{background:var(--coral-bg);color:var(--coral-ic);font-size:13px;padding:10px 12px;border-radius:9px;margin-bottom:14px;font-weight:600;}
.auth-hidden{display:none;}

/* ---------- Shell ---------- */
#app{display:none;min-height:100vh;}
.shell{display:flex;min-height:100vh;}
.sidebar{width:230px;flex-shrink:0;background:var(--sidebar-grad);border-inline-end:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;padding:22px 14px;position:sticky;top:0;height:100vh;color:var(--sidebar-ink);}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 20px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:16px;}
.brand .mark{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;}
.brand .txt{font-weight:800;font-size:14px;line-height:1.2;color:var(--sidebar-ink);}
.brand .txt small{display:block;color:var(--sidebar-muted);font-weight:600;font-size:10.5px;}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:11px;margin-bottom:4px;color:var(--sidebar-muted);font-weight:700;font-size:13.5px;border:1px solid transparent;background:transparent;width:100%;text-align:start;transition:.15s;}
.nav-item:hover{background:rgba(255,255,255,.08);color:var(--sidebar-ink);}
.nav-item.active{background:var(--nav-active-bg);border-color:var(--nav-active-border);color:#fff;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 6px 16px -6px rgba(0,0,0,.35);}
.nav-spacer{flex:1;}
.sidebar-foot{border-top:1px solid rgba(255,255,255,.12);padding-top:12px;margin-top:8px;}
.user-chip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);margin-bottom:8px;cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);}
.user-chip:hover{background:rgba(255,255,255,.14);}
.user-chip .av{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;}
.user-chip .meta{line-height:1.25;overflow:hidden;}
.user-chip .meta b{font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px;color:var(--sidebar-ink);}
.user-chip .meta span{font-size:10.5px;color:var(--sidebar-muted);font-weight:700;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{height:66px;flex-shrink:0;background:var(--card-bg);-webkit-backdrop-filter:var(--card-blur);backdrop-filter:var(--card-blur);border-bottom:1px solid var(--card-border);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:5;gap:14px;}
.topbar h1{font-size:17px;margin:0;font-weight:800;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
.topbar-actions{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.lang-btn,.theme-btn{background:rgba(255,255,255,.35);border:1px solid var(--card-border);border-radius:9px;padding:8px 12px;font-weight:800;font-size:12px;color:var(--teal-dark);}
.lang-btn:hover,.theme-btn:hover{background:rgba(255,255,255,.55);}
.content{padding:24px 26px;flex:1;width:100%;max-width:1440px;margin:0 auto;box-sizing:border-box;}

.btn-green{background:var(--teal-dark);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:800;font-size:13px;display:inline-flex;align-items:center;gap:6px;}
.btn-green:hover{background:var(--navy-2);filter:brightness(1.1);}
.btn-ghost{background:rgba(255,255,255,.35);color:var(--teal-dark);border:1px solid var(--card-border);border-radius:10px;padding:9px 15px;font-weight:800;font-size:13px;}
.btn-ghost:hover{background:rgba(255,255,255,.55);}
.btn-outline{background:transparent;border:1.5px solid var(--line);border-radius:9px;padding:7px 11px;font-size:12px;font-weight:700;color:var(--muted);}

.grid{display:grid;gap:16px;}
.cols-4{grid-template-columns:repeat(4,1fr);}
.cols-3{grid-template-columns:1.1fr 1.1fr 1.4fr;}
.cols-2{grid-template-columns:1fr 1fr;}
.cols-2b{grid-template-columns:1.6fr 1fr;}
@media(max-width:1100px){.cols-4{grid-template-columns:repeat(2,1fr);}.cols-3{grid-template-columns:repeat(2,1fr);}.cols-2b{grid-template-columns:1fr;}}
@media(max-width:700px){
  .cols-4,.cols-3,.cols-2,.cols-2b{grid-template-columns:1fr;}
  .sidebar{position:fixed;top:0;bottom:0;z-index:60;width:80vw;max-width:280px;height:100vh;transition:transform .25s ease;box-shadow:0 0 40px rgba(0,0,0,.35);}
  html[dir="rtl"] .sidebar{right:0;left:auto;transform:translateX(100%);}
  html[dir="rtl"] .sidebar.open{transform:translateX(0);}
  html[dir="ltr"] .sidebar{left:0;right:auto;transform:translateX(-100%);}
  html[dir="ltr"] .sidebar.open{transform:translateX(0);}
  .sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,10,25,.45);z-index:55;}
  .sidebar-backdrop.show{display:block;}
}

/* ---------- Reliable responsive layout (class-based) ----------
   Mirrors the @media rules above but is driven by JS-measured screen
   width (see head script) instead of the CSS layout viewport. Some
   WebViews/file-viewers misreport viewport width, which makes @media
   queries alone unreliable; these class rules always work because they
   don't depend on viewport width being reported correctly. Specificity
   here is naturally higher than the plain rules above, so it always wins
   once the class is present. */
html.is-tablet-down .cols-4,
html.is-tablet-down .cols-3{grid-template-columns:repeat(2,1fr);}
html.is-tablet-down .cols-2b{grid-template-columns:1fr;}

html.is-mobile .cols-4,
html.is-mobile .cols-3,
html.is-mobile .cols-2,
html.is-mobile .cols-2b{grid-template-columns:1fr;}

html.is-mobile .sidebar{position:fixed;top:0;bottom:0;z-index:60;width:80vw;max-width:280px;height:100vh;transition:transform .25s ease;box-shadow:0 0 40px rgba(0,0,0,.35);}
html.is-mobile[dir="rtl"] .sidebar{right:0;left:auto;transform:translateX(100%);}
html.is-mobile[dir="rtl"] .sidebar.open{transform:translateX(0);}
html.is-mobile[dir="ltr"] .sidebar{left:0;right:auto;transform:translateX(-100%);}
html.is-mobile[dir="ltr"] .sidebar.open{transform:translateX(0);}
html.is-mobile .sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,10,25,.45);z-index:55;}
html.is-mobile .sidebar-backdrop.show{display:block;}
html.is-mobile .hamburger{display:block;}
html.is-mobile .formrow{grid-template-columns:1fr;}

/* Mobile topbar: keep every action reachable without horizontal overflow
   by shrinking to icon-only buttons and allowing a graceful wrap on very
   narrow screens instead of clipping. */
html.is-mobile .topbar{height:auto;min-height:60px;padding:10px 14px;flex-wrap:wrap;row-gap:8px;}
html.is-mobile .topbar-actions{flex-wrap:wrap;justify-content:flex-end;gap:6px;}
html.is-mobile .topbar h1{font-size:15.5px;}
html.is-mobile .btn-green span,
html.is-mobile #btn-add-leader-top span{display:none;}
html.is-mobile .btn-green{padding:10px;}
html.is-mobile #btn-add-leader-top{padding:9px 10px;}
html.is-mobile .lang-btn,html.is-mobile .theme-btn{padding:8px 10px;}
html.is-mobile .content{padding:16px 14px;}
html.is-mobile .grid{gap:12px;}
html.is-mobile .card,html.is-mobile .stat-card,html.is-mobile .dep-card{padding:14px;}
html.is-mobile h2.page-title{font-size:18px;}

.card{background:var(--card-bg);-webkit-backdrop-filter:var(--card-blur);backdrop-filter:var(--card-blur);border:1px solid var(--card-border);border-radius:18px;padding:20px;}
.stat-card{background:var(--card-bg);-webkit-backdrop-filter:var(--card-blur);backdrop-filter:var(--card-blur);border:1px solid var(--card-border);border-radius:16px;padding:16px;display:flex;align-items:center;gap:12px;}
.stat-card .ic{width:44px;height:44px;border-radius:12px;background:var(--mint-bg);color:var(--mint-ic);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.stat-card .num{font-size:20px;font-weight:800;color:var(--navy);}
.stat-card .lbl{font-size:11.5px;color:var(--muted);font-weight:700;}

.section-title{font-size:14.5px;font-weight:800;margin:0 0 14px;color:var(--navy);}
h2.page-title{font-size:20px;font-weight:800;margin:0 0 4px;color:var(--navy);}
p.page-sub{color:var(--muted);font-size:13px;margin:0 0 18px;}

.dep-card{background:var(--card-bg);-webkit-backdrop-filter:var(--card-blur);backdrop-filter:var(--card-blur);border:1px solid var(--card-border);border-radius:16px;padding:18px;cursor:pointer;transition:.15s;}
.dep-card:hover{border-color:var(--teal);box-shadow:0 10px 24px -14px rgba(2,69,122,.4);transform:translateY(-2px);}
.dep-card .name{font-weight:800;font-size:15px;color:var(--navy);}
.dep-card .sub{color:var(--muted);font-size:12px;margin-top:2px;}
.dep-card .count{margin-top:12px;font-size:22px;font-weight:800;color:var(--teal-dark);}
.add-dep-card{border:2px dashed var(--card-border);border-radius:16px;padding:18px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:var(--muted);font-weight:800;font-size:13px;cursor:pointer;min-height:110px;}
.add-dep-card:hover{border-color:var(--teal);color:var(--teal-dark);background:var(--bg-2);}

.pill{display:inline-flex;align-items:center;gap:5px;background:var(--mint-bg);color:var(--mint-ic);font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:99px;}
.pill.warn{background:var(--coral-bg);color:var(--coral-ic);}
.pill.muted{background:var(--bg-2);color:var(--muted);}

.list-row{display:flex;align-items:center;justify-content:space-between;padding:11px 4px;border-bottom:1px solid var(--line);}
.list-row:last-child{border-bottom:none;}
.bar-row{margin-bottom:9px;}
.bar-row .top{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:4px;color:var(--navy);}
.bar-track{height:7px;background:var(--bg-2);border-radius:99px;overflow:hidden;}
.bar-fill{height:100%;background:var(--teal-dark);border-radius:99px;}
.pharm-row{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:12px;cursor:pointer;}
.pharm-row:hover{background:var(--bg-2);}
.pharm-row .av{width:36px;height:36px;border-radius:50%;background:var(--teal-dark);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px;}

.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--teal-dark);font-weight:800;font-size:13px;background:none;border:none;margin-bottom:14px;}

.modal-overlay{position:fixed;inset:0;background:rgba(0,15,35,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal{background:var(--card-bg);-webkit-backdrop-filter:blur(28px) saturate(160%);backdrop-filter:blur(28px) saturate(160%);border:1px solid var(--card-border);border-radius:18px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:26px;}
.modal h3{margin:0 0 4px;font-size:17px;font-weight:800;color:var(--navy);}
.modal-pos{position:relative;}
.formrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:500px){.formrow{grid-template-columns:1fr;}}
.checkbox-row{display:flex;align-items:center;gap:8px;background:var(--bg-2);padding:10px 12px;border-radius:10px;margin-bottom:12px;}
.checkbox-row input{width:16px;height:16px;}
.checkbox-row label{font-size:13px;font-weight:700;}
.conditional-block{border-inline-start:3px solid var(--teal);padding:12px;margin:10px 0 16px;background:var(--bg-2);border-radius:0 10px 10px 0;}

.filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px;background:var(--card-bg);-webkit-backdrop-filter:var(--card-blur);backdrop-filter:var(--card-blur);border:1px solid var(--card-border);border-radius:14px;padding:10px 14px;}
.filter-bar select{padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;font-size:12.5px;font-weight:700;background:var(--bg-2);color:var(--navy);}
.filter-bar .flabel{font-size:12px;color:var(--muted);font-weight:800;}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-head{text-align:center;font-size:11px;font-weight:800;color:var(--muted);padding-bottom:6px;}
.cal-day{min-height:76px;border:1px solid var(--card-border);border-radius:10px;padding:6px;font-size:12px;background:var(--card-bg);cursor:pointer;position:relative;}
.cal-day.empty{background:transparent;border:none;cursor:default;}
.cal-day:hover:not(.empty){border-color:var(--teal);}
.cal-day .dnum{font-weight:800;font-size:12px;color:var(--navy);}
.cal-day.today{background:var(--mint-bg);border-color:var(--teal);}
.cal-day.today .dnum{color:var(--mint-ic);}
.cal-day .evt-dot{font-size:9.5px;background:var(--blue-bg);color:var(--blue-ic);border-radius:6px;padding:1px 5px;margin-top:3px;display:block;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}

.clock-card{background:var(--card-bg);-webkit-backdrop-filter:var(--card-blur);backdrop-filter:var(--card-blur);border:1px solid var(--card-border);border-radius:18px;padding:18px;display:flex;align-items:center;gap:16px;}
.clock-face{width:78px;height:78px;border-radius:50%;background:var(--bg-2);border:1.5px solid var(--line);position:relative;flex-shrink:0;}
.clock-face .tick{position:absolute;width:2px;height:6px;background:var(--muted);left:50%;top:3px;transform-origin:1px 36px;opacity:.5;}
.clock-hand{position:absolute;left:50%;bottom:50%;transform-origin:bottom center;background:var(--navy);border-radius:3px;}
.clock-hand.hour{width:3px;height:20px;margin-left:-1.5px;}
.clock-hand.minute{width:2px;height:28px;margin-left:-1px;background:var(--teal-dark);}
.clock-hand.second{width:1px;height:30px;margin-left:-.5px;background:var(--coral-ic);}
.clock-center{position:absolute;left:50%;top:50%;width:6px;height:6px;background:var(--navy);border-radius:50%;transform:translate(-50%,-50%);}
.clock-digital b{font-size:22px;color:var(--navy);display:block;}
.clock-digital span{font-size:12px;color:var(--muted);font-weight:700;}
.mini-cal-card{background:var(--card-bg);-webkit-backdrop-filter:var(--card-blur);backdrop-filter:var(--card-blur);border:1px solid var(--card-border);border-radius:18px;padding:18px;}
.mini-cal-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.mini-cal-title b{font-size:14px;color:var(--navy);}
.mini-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.mini-cal .h{font-size:9.5px;color:var(--muted);text-align:center;font-weight:700;padding-bottom:3px;}
.mini-cal .d{font-size:11px;text-align:center;padding:6px 0;border-radius:8px;color:var(--navy);position:relative;}
.mini-cal .d.has::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--blue-ic);}
.mini-cal .d.today{background:var(--teal-dark);color:#fff;font-weight:800;}
.mini-cal .d.blank{visibility:hidden;}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;font-weight:700;z-index:200;}
.empty-state{text-align:center;padding:44px 20px;color:var(--muted);}
.empty-state .ic{font-size:32px;margin-bottom:8px;}
.badge-role{font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--mint-bg);color:var(--mint-ic);}
.badge-role.leader{background:var(--gold-bg);color:var(--gold-ic);}
.loader{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--muted);font-weight:700;font-size:13px;}
.hamburger{display:none;border:none;background:var(--bg-2);border-radius:8px;padding:8px;flex-shrink:0;}
.topbar-left h1{min-width:0;flex:1;}
@media(max-width:700px){.hamburger{display:block;}}
.legend-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:6px;}

/* ---------- Added: 3-dot menus, intervention rows, accordions, details ---------- */
.dm-btn{padding:4px 10px;font-size:17px;line-height:1;border-radius:8px;flex-shrink:0;}
.dm-floating{position:fixed;z-index:300;min-width:150px;background:var(--menu-bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(0,20,50,.3);padding:4px;}
.dm-floating button{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;background:none;border:0;border-radius:8px;font-size:13px;font-weight:700;color:var(--navy);text-align:start;}
.dm-floating button:hover{background:var(--bg-2);}
.dm-floating button.danger{color:var(--danger);}
.iv-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-top:1px solid var(--line);}
.iv-row .d{color:var(--muted);font-size:12px;min-width:76px;font-weight:700;}
.iv-row .drug{flex:1;min-width:0;font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.acc{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden;}
.acc-head{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;background:var(--bg-2);border:0;color:var(--navy);font-size:14px;text-align:start;}
.acc-head b{flex:1;min-width:0;}
.acc-head:disabled{cursor:default;opacity:.6;}
.acc-body{padding:4px 12px 10px;}
.acc-pharm{margin-top:10px;}
.acc-pharm-h{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;}
.av-sm{width:26px;height:26px;border-radius:50%;background:var(--mint-bg);color:var(--mint-ic);font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.dt-row{display:flex;flex-direction:column;gap:2px;padding:9px 0;border-bottom:1px solid var(--line);}
.dt-row span{font-size:11.5px;color:var(--muted);font-weight:700;}
.dt-row b{font-size:13.5px;font-weight:600;white-space:pre-wrap;word-break:break-word;color:var(--navy);}
.dt-sec{font-size:12.5px;font-weight:800;color:var(--teal-dark);margin:16px 0 2px;}
.hn-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-top:1px solid var(--line);cursor:pointer;}
.hn-row:hover{background:var(--bg-2);}
.hn-row .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.hn-row b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hn-row small{color:var(--muted);font-size:11px;font-weight:600;}
.hk-sum .top{gap:12px;align-items:flex-start;}
.hk-sum .top span:last-child{white-space:nowrap;}
.hk-form-ind{border:1.5px solid var(--line);border-radius:12px;padding:12px 12px 2px;margin-bottom:12px;background:var(--bg-2);}
.hk-form-ind.err{border-color:var(--danger);}
.hk-form-t{font-weight:800;font-size:13px;line-height:1.6;margin-bottom:10px;color:var(--navy);}
.tap-card{cursor:pointer;transition:.15s;}
.tap-card:hover{border-color:var(--teal);}
</style>
</head>

    </form>

    <form id="form-register" class="auth-hidden">
      <div class="field"><label>الاسم الكامل</label><input type="text" id="re-name" required></div>
      <div class="field"><label>القسم</label><select id="re-dept" required><option value="">اختر القسم...</option></select></div>
      <div class="field"><label>البريد الإلكتروني</label><input type="email" id="re-email" required></div>
      <div class="field"><label>كلمة المرور</label><input type="password" id="re-pass" required minlength="6"></div>
      <button class="btn-primary" type="submit" id="re-btn">إنشاء الحساب</button>
    </form>
  </div>
</div>

/* ============================================================ BOOT */
async function bootApp(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session){return;}
  STATE.session=session;
  try{
    let {data:profile} = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
    if(!profile){ toast(LANG==='ar'?'جاري تجهيز حسابك...':'Setting up your account...'); await new Promise(r=>setTimeout(r,1200)); ({data:profile} = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle()); }
    STATE.profile=profile; STATE.isLeader = profile?.role==='leader';

    const [dep,ward,drg,rf,pt,pc,es,sv] = await Promise.all([
      sb.from('departments').select('*').order('sort_order'),
      sb.from('wards').select('*'),
      sb.from('drugs').select('id,name').order('name'),
      sb.from('reference_sources').select('id,name').order('name'),
      sb.from('problem_types').select('id,label').order('label'),
      sb.from('possible_causes').select('id,label').order('label'),
      sb.from('error_stages').select('id,label').order('label'),
      sb.from('severity_levels').select('id,label').order('label'),
    ]);
    STATE.departments=dep.data||[]; STATE.wards=ward.data||[]; STATE.drugs=drg.data||[];
    STATE.refs=rf.data||[]; STATE.problemTypes=pt.data||[]; STATE.causes=pc.data||[];
    STATE.stages=es.data||[]; STATE.severities=sv.data||[];
  }catch(err){
    console.error('bootApp data load failed:', err);
    toast(LANG==='ar'?'حدث خطأ أثناء تحميل البيانات، بعض الأقسام قد لا تعمل':'Error loading data, some sections may not work');
  }

  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app').style.display='block';
  try{
    applyLang();
    renderSidebar();
    refreshUserChip();
    $('#btn-add-leader-top').style.display = STATE.isLeader ? 'inline-flex' : 'none';
    goto('home');
  }catch(err){
    console.error('bootApp render failed:', err);
    toast(LANG==='ar'?'حدث خطأ أثناء عرض الواجهة':'Error rendering the interface');
  }
}

function filterBarHtml(){

    <span class="flabel">${t('filter_month')}</span>
    <select id="f-month"><option value="">${t('all')}</option>${months.slice(1).map((m,i)=>`<option value="${i+1}" ${STATE.filter.month==(i+1)?'selected':''}>${m}</option>`).join('')}</select>
    <span class="flabel">${t('filter_day')}</span>
    <select id="f-day"><option value="">${t('all')}</option>${Array.from({length:31},(_,i)=>i+1).map(d=>`<option value="${d}" ${STATE.filter.day==d?'selected':''}>${d}</option>`).join('')}</select>

function bindFilterBar(cb){
  $('#f-year').onchange=(e)=>{STATE.filter.year=parseInt(e.target.value); cb();};
  $('#f-month').onchange=(e)=>{STATE.filter.month=e.target.value; STATE.filter.day=''; cb();};
  $('#f-day').onchange=(e)=>{STATE.filter.day=e.target.value; cb();};
}
function getRange(f){
  const year=f.year||new Date().getFullYear();
  if(f.day && f.month){ const d=`${year}-${pad(f.month)}-${pad(f.day)}`; return {start:d,end:d}; }
  if(f.month){ const start=new Date(year,f.month-1,1).toISOString().slice(0,10); const end=new Date(year,f.month,0).toISOString().slice(0,10); return {start,end}; }
  return {start:`${year}-01-01`, end:`${year}-12-31`};
}

    sb.from('quick_notes').select('*, profiles!quick_notes_created_by_fkey(full_name)').order('created_at',{ascending:false}).limit(5),
  ]);
  const rows=monthRows||[];
  const total=rows.length, dtp=rows.filter(r=>r.is_dtp).length, me=rows.filter(r=>r.is_medication_error).length;
  const accept=rows.filter(r=>r.physician_acceptance==='Accept').length, reject=rows.filter(r=>r.physician_acceptance==='reject').length;

  const byDept={}; rows.forEach(r=>{byDept[r.department_id]=(byDept[r.department_id]||0)+1;});
  const topDepts=Object.entries(byDept).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([id,count])=>({dept:STATE.departments.find(d=>d.id===id), count}));
  const maxTop = Math.max(1, ...topDepts.map(t=>t.count));

  const monthNamesShort = LANG==='ar' ? ['ينا','فبر','مار','أبر','ماي','يون','يول','أغس','سبت','أكت','نوف','ديس'] : ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const trendBuckets=[]; for(let i=5;i>=0;i--){ const dt=new Date(now.getFullYear(),now.getMonth()-i,1); trendBuckets.push({y:dt.getFullYear(),m:dt.getMonth(),count:0}); }
  (allTimeRows||[]).forEach(r=>{ const d=new Date(r.intervention_date); const b=trendBuckets.find(x=>x.y===d.getFullYear()&&x.m===d.getMonth()); if(b) b.count++; });

let CLOCK_INTERVAL=null;
function startClock(el){
  if(CLOCK_INTERVAL) clearInterval(CLOCK_INTERVAL);
  el.innerHTML=`
    <div class="clock-face" id="clock-face">
      <div class="clock-hand hour" id="ch-hour"></div>
      <div class="clock-hand minute" id="ch-min"></div>
      <div class="clock-hand second" id="ch-sec"></div>
      <div class="clock-center"></div>
    </div>
    <div class="clock-digital"><b id="clock-time">--:--</b><span id="clock-date">-</span></div>
  `;
  function tick(){
    const now=new Date();
    const h=now.getHours()%12, m=now.getMinutes(), s=now.getSeconds();
    const hourEl=document.getElementById('ch-hour'), minEl=document.getElementById('ch-min'), secEl=document.getElementById('ch-sec');
    if(!hourEl) { clearInterval(CLOCK_INTERVAL); return; }
    hourEl.style.transform = `rotate(${h*30+m*0.5}deg)`;
    minEl.style.transform = `rotate(${m*6}deg)`;
    secEl.style.transform = `rotate(${s*6}deg)`;
    const timeEl=document.getElementById('clock-time'), dateEl=document.getElementById('clock-date');
    if(timeEl) timeEl.textContent = now.toLocaleTimeString(LANG==='ar'?'ar-EG':'en-US',{hour:'2-digit',minute:'2-digit'});
    if(dateEl) dateEl.textContent = now.toLocaleDateString(LANG==='ar'?'ar-EG':'en-US',{weekday:'short', day:'numeric', month:'short'});
  }
  tick();
  CLOCK_INTERVAL=setInterval(tick,1000);
}

function renderMiniCalendar(el, events){
  const now=new Date();
  const y=now.getFullYear(), m=now.getMonth();
  const first=new Date(y,m,1); const startOffset=first.getDay(); const daysInMonth=new Date(y,m+1,0).getDate();
  const evDays=new Set((events||[]).map(e=>new Date(e.event_date).getDate()).filter((_,i)=>true));
  const evByDate={}; (events||[]).forEach(e=>{const d=new Date(e.event_date); if(d.getMonth()===m) evByDate[d.getDate()]=true;});
  const dowAr=['أ','ن','ث','ر','خ','ج','س']; const dowEn=['S','M','T','W','T','F','S'];
  let cells='';
  for(let i=0;i<startOffset;i++) cells+=`<div class="d blank">.</div>`;
  for(let d=1; d<=daysInMonth; d++){
    const isToday = d===now.getDate();
    cells+=`<div class="d ${isToday?'today':''} ${evByDate[d]?'has':''}">${d}</div>`;
  }
  el.innerHTML=`
    <div class="mini-cal-title"><b>${t('calendar_card')}</b><span class="pill muted">${now.toLocaleDateString(LANG==='ar'?'ar-EG':'en-US',{month:'long'})}</span></div>
    <div class="mini-cal">
      ${(LANG==='ar'?dowAr:dowEn).map(d=>`<div class="h">${d}</div>`).join('')}
      ${cells}
    </div>
    <button class="btn-ghost" style="width:100%;margin-top:14px;" onclick="goto('calendar')">${t('nav_calendar')} →</button>
  `;
}

/* ============================================================ SHARED UI HELPERS (3-dot menu, confirm, modal) */
function L(ar,en){ return LANG==='ar' ? ar : en; }
function closeDotsMenu(){ document.querySelectorAll('.dm-floating').forEach(m=>m.remove()); }
document.addEventListener('click', closeDotsMenu);
window.addEventListener('scroll', closeDotsMenu, true);
window.addEventListener('resize', closeDotsMenu);
function dotsBtn(key){ return `<button type="button" class="btn-outline dm-btn" data-dots="${esc(key)}" aria-label="${L('خيارات','Options')}">⋮</button>`; }
function bindDots(root, getItems){
  root.querySelectorAll('[data-dots]').forEach(btn=>{
    btn.onclick=(e)=>{
      e.stopPropagation();
      const open=document.querySelector('.dm-floating');
      const same = open && open.dataset.owner===btn.dataset.dots;
      closeDotsMenu();
      if(same) return;
      const items=getItems(btn.dataset.dots);
      if(!items || !items.length) return;
      const m=document.createElement('div'); m.className='dm-floating'; m.dataset.owner=btn.dataset.dots;
      m.innerHTML=items.map((it,i)=>`<button type="button" data-i="${i}" class="${it.danger?'danger':''}"><span>${it.icon}</span><span>${it.label}</span></button>`).join('');
      m.addEventListener('click', ev=>ev.stopPropagation());
      document.body.appendChild(m);
      m.querySelectorAll('button').forEach(b=>b.onclick=(ev)=>{ ev.stopPropagation(); closeDotsMenu(); items[+b.dataset.i].fn(); });
      const r=btn.getBoundingClientRect(), mw=m.offsetWidth, mh=m.offsetHeight;
      let left=r.right-mw; left=Math.max(8, Math.min(left, window.innerWidth-mw-8));
      let top=r.bottom+4; if(top+mh>window.innerHeight-8) top=Math.max(8, r.top-mh-4);
      m.style.left=left+'px'; m.style.top=top+'px';
    };
  });
}
function confirmDialog({icon='🗑', title, text='', yes=L('نعم، احذف','Yes, delete'), danger=true}){
  return new Promise(resolve=>{
    const overlay=document.createElement('div'); overlay.className='modal-overlay'; overlay.style.zIndex=250;
    overlay.innerHTML=`
      <div class="modal modal-pos" style="max-width:380px;text-align:center;">
        <div style="font-size:34px;margin-bottom:8px;">${icon}</div>
        <h3 style="margin-bottom:6px;">${title}</h3>
        ${text?`<p class="page-sub">${text}</p>`:''}
        <div style="display:flex;gap:10px;margin-top:16px;">
          <button class="btn-outline" data-r="0" style="flex:1;">${t('cancel')}</button>
          <button class="btn-primary" data-r="1" style="flex:1;${danger?'background:#D65C4A;':''}">${yes}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const done=v=>{ overlay.remove(); resolve(v); };
    overlay.onclick=e=>{ if(e.target===overlay) done(false); };
    overlay.querySelectorAll('button').forEach(b=>b.onclick=()=>done(b.dataset.r==='1'));
  });
}
function openModal(html, opts={}){
  const overlay=document.createElement('div'); overlay.className='modal-overlay';
  overlay.innerHTML=`<div class="modal modal-pos" style="max-width:${opts.maxWidth||560}px;"><button class="btn-outline close" style="position:absolute;left:18px;top:18px;">✕</button>${html}</div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('.close').onclick=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) overlay.remove(); };
  return overlay;
}

      <div class="stat-card"><div class="ic" style="background:var(--coral-bg);color:var(--coral-ic);">${iPill()}</div><div><div class="num">${me}</div><div class="lbl">${t('total_me')}</div></div></div>
      <div class="stat-card"><div class="ic" style="background:var(--blue-bg);color:var(--blue-ic);">${iUsers()}</div><div><div class="num">${accRate}%</div><div class="lbl">${t('accept_rate')}</div></div></div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div class="section-title">👥 ${t('dept_pharms')} (${(roster||[]).length})</div>
        ${STATE.isLeader? `<button class="btn-primary" id="add-pharm-btn" style="width:auto;">➕ ${t('add_pharm')}</button>` : ''}
      </div>
      ${roster&&roster.length? roster.map(p=>`
        <div class="pharm-row" data-id="${p.id}" data-name="${esc(p.full_name)}">
          <div class="av">${initials(p.full_name)}</div>
          <div style="flex:1;"><b style="font-size:14px;">${esc(p.full_name)}</b></div>
          <span class="pill">${countByRoster[p.id]||0}</span>
          ${STATE.isLeader? `
          <div class="dots-menu-wrap" style="position:relative;margin-right:8px;">
            <button class="btn-outline dots-btn" data-id="${p.id}" style="padding:5px 10px;font-size:16px;line-height:1;">⋮</button>
            <div class="dots-menu" data-id="${p.id}" style="display:none;position:absolute;left:0;top:100%;margin-top:4px;background:var(--card-bg,#fff);border:1px solid var(--line,#e5e5e5);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:20;min-width:130px;overflow:hidden;">
              <button class="dots-delete" data-id="${p.id}" data-name="${esc(p.full_name)}" style="display:block;width:100%;text-align:right;padding:10px 14px;background:none;border:0;color:#D65C4A;font-family:inherit;font-size:13px;cursor:pointer;">🗑 ${t('remove')}</button>

function openConfirmRemovePharmModal(rosterId, name){

      <p class="page-sub">${LANG==='ar'?'سيتم إزالته من هذا القسم ويمكن إضافته لقسم آخر لاحقًا':'They will be unassigned from this department and can be added to another department later'}</p>

    </div>`;

    if(error){ toast(LANG==='ar'?'تعذر الحذف':'Could not remove'); console.error(error); return; }
    // keep the linked login profile in sync (unassigned pharmacist keeps their account, just no department yet)
    await sb.from('profiles').update({department_id:null}).eq('roster_id', rosterId);

function openAddPharmacistModal(dept){
  const overlay=document.createElement('div'); overlay.className='modal-overlay';
  overlay.innerHTML=`
    <div class="modal modal-pos">
      <button class="btn-outline close" style="position:absolute;left:18px;top:18px;">✕</button>
      <h3>${t('add_pharm')} — ${esc(deptName(dept))}</h3>
      <div class="field">
        <label>${LANG==='ar'?'صيدلي غير مسجل بأي قسم (اختياري)':'Unassigned pharmacist (optional)'}</label>
        <select id="ap-existing"><option value="">${LANG==='ar'?'— اختر لنقله لهذا القسم —':'— choose to move here —'}</option></select>
      </div>
      <p class="page-sub" style="margin:4px 0 12px;">${LANG==='ar'?'أو أضف اسمًا جديدًا بالكامل:':'Or add a brand-new name:'}</p>
      <div class="field"><label>${t('pharm_name_ph')}</label><input type="text" id="ap-name" placeholder="${t('pharm_name_ph')}"></div>
      <button class="btn-primary" id="ap-save">${t('save')}</button>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('.close').onclick=()=>overlay.remove();
  overlay.onclick=(e)=>{if(e.target===overlay)overlay.remove();};

  sb.from('roster').select('id,full_name').is('department_id', null).eq('active',true).order('full_name').then(({data})=>{
    const sel = $('#ap-existing', overlay);
    (data||[]).forEach(p=>{ const o=document.createElement('option'); o.value=p.id; o.textContent=p.full_name; sel.appendChild(o); });
  });

  overlay.querySelector('#ap-save').onclick=async()=>{
    const existingId = $('#ap-existing', overlay).value;
    const newName = $('#ap-name', overlay).value.trim();
    if(!existingId && !newName){ toast(LANG==='ar'?'اختر صيدليًا أو اكتب اسمًا':'Choose a pharmacist or enter a name'); return; }
    if(existingId){
      const {error} = await sb.from('roster').update({department_id:dept.id, active:true}).eq('id', existingId);
      if(error){ toast(LANG==='ar'?'تعذر النقل':'Could not move'); console.error(error); return; }
      await sb.from('profiles').update({department_id:dept.id}).eq('roster_id', existingId);
      overlay.remove(); toast(LANG==='ar'?'تم النقل ✅':'Moved ✅'); renderView();
    } else {
      const {error} = await sb.from('roster').insert({department_id:dept.id, full_name:newName, active:true});
      if(error){ toast(LANG==='ar'?'تعذر الإضافة':'Could not add'); console.error(error); return; }
      overlay.remove(); toast(LANG==='ar'?'تمت الإضافة ✅':'Added ✅'); renderView();
    }
  };
}

    ${filterBarHtml()}
    <div class="grid cols-3" style="margin:18px 0;">

async function renderDeptKPI(c){
  const {start,end} = getRange(STATE.filter);
  const {data:rows} = await sb.from('interventions').select('is_dtp,is_medication_error,physician_acceptance,reference_used,error_stage,roster_id,roster(full_name)').gte('intervention_date',start).lte('intervention_date',end);
  const all=rows||[];
  const total=all.length, dtp=all.filter(r=>r.is_dtp).length, me=all.filter(r=>r.is_medication_error).length;
  const accept=all.filter(r=>r.physician_acceptance==='Accept').length, reject=all.filter(r=>r.physician_acceptance==='reject').length;
  const byPharm={}; all.forEach(r=>{const n=r.roster?.full_name; if(n) byPharm[n]=(byPharm[n]||0)+1;});
  const pharmSorted=Object.entries(byPharm).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const byRef={}; all.forEach(r=>{if(r.reference_used) byRef[r.reference_used]=(byRef[r.reference_used]||0)+1;});
  const refSorted=Object.entries(byRef).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const byStage={}; all.forEach(r=>{if(r.error_stage) byStage[r.error_stage]=(byStage[r.error_stage]||0)+1;});
  const stageOrder=['Ordering decision','Ordering Process','Preparation','Storage','Transcribing','Dispensing','Administration','Monitoring'];
  const stageLabels = stageOrder.filter(s=>byStage[s]!==undefined).length ? stageOrder : Object.keys(byStage);

  c.innerHTML=`
    <div style="display:flex;justify-content:flex-end;margin-bottom:6px;">
      ${STATE.isLeader? `<button class="btn-primary" id="kpi-export" style="width:auto;">⬇ ${t('export_excel')}</button>` : ''}
    </div>
    ${filterBarHtml()}
    <div class="grid cols-4" style="margin-bottom:20px;">
      <div class="stat-card"><div><div class="num">${total}</div><div class="lbl">${t('total_iv')}</div></div></div>
      <div class="stat-card"><div><div class="num">${dtp}</div><div class="lbl">DTP</div></div></div>
      <div class="stat-card"><div><div class="num">${me}</div><div class="lbl">${t('total_me')}</div></div></div>
      <div class="stat-card"><div><div class="num">${total? Math.round(accept/((accept+reject)||1)*100):0}%</div><div class="lbl">${t('accept_rate')}</div></div></div>
    </div>
    <div class="grid cols-2" style="margin-bottom:16px;">
      <div class="card"><div class="section-title">Figure 1 — Acceptance</div><canvas id="k-accept"></canvas></div>
      <div class="card"><div class="section-title">Figure 2 — ${LANG==='ar'?'التقارير حسب الصيدلي':'Reports per pharmacist'}</div><canvas id="k-pharm"></canvas></div>
    </div>
    <div class="grid cols-2">
      <div class="card"><div class="section-title">Figure 3 — ${LANG==='ar'?'المراجع المستخدمة':'References used'}</div><canvas id="k-refs"></canvas></div>
      <div class="card"><div class="section-title">${LANG==='ar'?'الأخطاء حسب المرحلة':'Errors by stage'}</div><canvas id="k-stage"></canvas></div>
    </div>
  `;
  bindFilterBar(renderKPIs);
  setChartDefaults(); const CP=chartPalette();
  new Chart($('#k-accept'),{type:'doughnut', data:{labels:[LANG==='ar'?'قبول':'Accepted', LANG==='ar'?'رفض':'Rejected'], datasets:[{data:[accept,reject], backgroundColor:[CP.mint,CP.coral]}]}, options:{plugins:{legend:{position:'bottom'}}}});
  new Chart($('#k-pharm'),{type:'bar', data:{labels:pharmSorted.map(p=>p[0]), datasets:[{data:pharmSorted.map(p=>p[1]), backgroundColor:CP.teal}]}, options:{indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{beginAtZero:true,ticks:{precision:0}}}}});
  new Chart($('#k-refs'),{type:'bar', data:{labels:refSorted.map(r=>r[0]), datasets:[{data:refSorted.map(r=>r[1]), backgroundColor:CP.navy}]}, options:{plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});

/* ---- Hospital KPI: weeks -> indicators (pharmacist = own entries, leader = department picker) ---- */
const HK_WEEKS_AR=['الأسبوع الأول','الأسبوع الثاني','الأسبوع الثالث','الأسبوع الرابع'];
const HK_WEEKS_EN=['Week 1','Week 2','Week 3','Week 4'];
function hkWeekName(w){ return (LANG==='ar'?HK_WEEKS_AR:HK_WEEKS_EN)[w-1]; }
function hkMonthNames(){ return LANG==='ar' ? ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'] : ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; }
function hkSums(rows){ const o={}; HKPI_NUM_FIELDS.forEach(f=>o[f]=0); rows.forEach(r=>HKPI_NUM_FIELDS.forEach(f=>o[f]+=Number(r[f]||0))); return o; }
function hkRowHas(r,ind){ return Number(r[ind.total]||0)>0 || Number(r[ind.part]||0)>0; }
function hkFilled(sums,ind){ return sums[ind.total]>0 || sums[ind.part]>0; }
function hkPct(sums,ind){ return sums[ind.total]>0 ? Math.round(sums[ind.part]/sums[ind.total]*1000)/10 : 0; }

async function hkLoad(deptId, year, month){
  let q = sb.from('hospital_kpi_entries').select('*').eq('entry_year',year).eq('entry_month',month);
  if(deptId) q = q.eq('department_id', deptId);
  if(!STATE.isLeader) q = q.eq('submitted_by', STATE.profile.id);
  const {data,error} = await q; if(error) console.error(error);
  const rows=data||[]; const names={};
  if(STATE.isLeader && deptId && rows.length){
    const ids=[...new Set(rows.map(r=>r.submitted_by).filter(Boolean))];
    const {data:profs} = await sb.from('profiles').select('id,full_name').in('id',ids);
    (profs||[]).forEach(pp=>names[pp.id]=pp.full_name);
  }
  return {rows,names};
}
function hkFilterHtml(){
  const HK=STATE.hk, cy=new Date().getFullYear(); const years=[]; for(let y=cy+1;y>=cy-4;y--) years.push(y);
  return `<div class="filter-bar">
    <span class="flabel">${t('filter_year')}</span><select id="hk-year">${years.map(y=>`<option value="${y}" ${HK.year===y?'selected':''}>${y}</option>`).join('')}</select>
    <span class="flabel">${t('filter_month')}</span><select id="hk-month">${hkMonthNames().map((m,i)=>`<option value="${i+1}" ${HK.month===i+1?'selected':''}>${m}</option>`).join('')}</select>
  </div>`;
}
function hkBindFilter(){
  $('#hk-year').onchange=e=>{ STATE.hk.year=parseInt(e.target.value); STATE.hk.week=null; renderKPIs(); };
  $('#hk-month').onchange=e=>{ STATE.hk.month=parseInt(e.target.value); STATE.hk.week=null; renderKPIs(); };
}
function hkExportHtml(){ return STATE.isLeader ? `<button class="btn-primary" id="hkpi-export-xlsx" style="width:auto;">⬇ Excel</button><button class="btn-outline" id="hkpi-export-pdf">⬇ PDF</button>` : ''; }
function hkBindExport(deptId){
  if(!STATE.isLeader) return;
  $('#hkpi-export-xlsx').onclick=()=>exportHospitalKpiExcel(STATE.hk.year, STATE.hk.month, hkMonthNames(), deptId);
  $('#hkpi-export-pdf').onclick=()=>exportHospitalKpiPdf(STATE.hk.year, STATE.hk.month, hkMonthNames(), deptId);
}

async function renderHospitalKPI(c){
  const HK=STATE.hk;
  if(STATE.isLeader && !HK.dept) return renderHkDeptList(c);
  const deptId = STATE.isLeader ? HK.dept : STATE.profile.department_id;
  if(!deptId){ c.innerHTML=`<div class="card empty-state"><div class="ic">🏥</div>${L('حسابك غير مرتبط بقسم بعد، تواصل مع القائد','Your account is not linked to a department yet')}</div>`; return; }
  const dept=STATE.departments.find(d=>d.id===deptId);
  const {rows,names}=await hkLoad(deptId, HK.year, HK.month);
  const ctx={deptId, dept, rows, names, year:HK.year, month:HK.month};
  if(HK.week) return renderHkWeek(c,ctx);
  return renderHkWeeks(c,ctx);
}

/* One week: the 8 indicators */
function renderHkWeek(c,ctx){
  const w=STATE.hk.week; const mn=hkMonthNames();
  const wr=ctx.rows.filter(r=>r.week_number===w); const sw=hkSums(wr);
  c.innerHTML=`
    <button class="back-link" id="hk-back-weeks">→ ${L('رجوع إلى الأسابيع','Back to weeks')}</button>

      <h2 class="page-title" style="font-size:18px;margin:0;">${hkWeekName(w)} — ${mn[ctx.month-1]} ${ctx.year}</h2>${hkAddBtnHtml()}
    </div>
    <p class="page-sub">${esc(deptName(ctx.dept))} — ${STATE.isLeader ? L('مدخلات القسم كلها','All department entries') : L('المدخلات التي أضفتها','Entries you added')}</p>

            ${ind.part_label}: <b style="color:var(--navy);">${sw[ind.part]}</b>

function hkEditInd(ctx,w,ind){
  const wr=ctx.rows.filter(r=>r.week_number===w);
  if(!STATE.isLeader) return openHkModal(ind,{ctx, week:w, row:wr.find(r=>r.submitted_by===STATE.profile.id)||null});
  const withData=wr.filter(r=>hkRowHas(r,ind));
  if(withData.length>1){ toast(L('اختر الصيدلي من القائمة','Pick a pharmacist from the list')); return hkIndDetails(ctx,w,ind); }
  openHkModal(ind,{ctx, week:w, row: withData[0] || wr.find(r=>r.submitted_by===STATE.profile.id) || null});
}
function hkDeleteInd(ctx,w,ind){
  const withData=ctx.rows.filter(r=>r.week_number===w && hkRowHas(r,ind));
  if(!withData.length) return;
  if(withData.length>1){ toast(L('اختر الصيدلي من القائمة','Pick a pharmacist from the list')); return hkIndDetails(ctx,w,ind); }
  hkClearRow(withData[0], ind);
}
async function hkClearRow(row, ind){
  const ok=await confirmDialog({title:L('حذف بيانات هذا المؤشر؟','Delete this indicator’s data?'), text:esc(ind.title)});
  if(!ok) return;
  const upd={[ind.total]:0,[ind.part]:0}; if(ind.key==='me') upd.me_category=null;
  const merged={...row,...upd};
  const allEmpty=HKPI_NUM_FIELDS.every(f=>!Number(merged[f]));
  const res = allEmpty
    ? await sb.from('hospital_kpi_entries').delete().eq('id',row.id).select('id')

async function hkSaveIndicator(ind,{deptId,year,month,week,submitter,total,part,cat}){
  const {data:existing}=await sb.from('hospital_kpi_entries').select('id')
    .eq('department_id',deptId).eq('entry_year',year).eq('entry_month',month).eq('week_number',week).eq('submitted_by',submitter).maybeSingle();
  if(existing){
    const upd={[ind.total]:total,[ind.part]:part,updated_at:new Date().toISOString()}; if(ind.key==='me') upd.me_category=cat;
    const res=await sb.from('hospital_kpi_entries').update(upd).eq('id',existing.id).select('id');
    if(!res.error && !(res.data&&res.data.length)) return {error:{message:'no rows updated (permission?)'}};
    return res;
  }
  const payload={department_id:deptId,entry_year:year,entry_month:month,week_number:week,submitted_by:submitter};
  HKPI_NUM_FIELDS.forEach(f=>payload[f]=0); payload[ind.total]=total; payload[ind.part]=part; if(ind.key==='me') payload.me_category=cat;
  return await sb.from('hospital_kpi_entries').insert(payload);
}

const SHEET_GROUPS = [...HOSPITAL_KPI_INDICATORS].reverse(); // matches original column order H..Y (8,7,6,4,3c,3b,3a,2,1)
const SHEET_COLS = ['H','I','J','K','L','M','N','O','P','Q','R','S','T','U','V','W','X','Y'];
(function assignCols(){ let i=0; SHEET_GROUPS.forEach(g=>{ g.colTotal=SHEET_COLS[i]; g.colPart=SHEET_COLS[i+1]; i+=2; }); })();
const WEEK_LABELS_AR=['الاسبوع الاول','الاسبوع الثاني','الاسبوع الثالث','الاسبوع الرابع'];

async function fetchHospitalKpiRaw(year, month, deptId){
  let q = sb.from('hospital_kpi_entries').select('*').eq('entry_year', year).eq('entry_month', month);
  if(deptId) q = q.eq('department_id', deptId);
  if(!STATE.isLeader && STATE.profile.department_id) q = q.eq('department_id', STATE.profile.department_id);
  const {data} = await q;
  const byDept={};
  (data||[]).forEach(r=>{ (byDept[r.department_id]=byDept[r.department_id]||[]).push(r); });
  return byDept;
}
function weekSumsForDept(entriesForDept){
  const weeks=[1,2,3,4].map(()=>{ const o={}; HKPI_NUM_FIELDS.forEach(f=>o[f]=0); return o; });
  (entriesForDept||[]).forEach(r=>{ const w=r.week_number-1; if(w>=0&&w<4) HKPI_NUM_FIELDS.forEach(f=>weeks[w][f]+=Number(r[f]||0)); });
  return weeks;
}
function base64ToArrayBuffer(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return bytes.buffer;
}

async function exportHospitalKpiExcel(year, month, monthNames, deptId){
  const byDept = await fetchHospitalKpiRaw(year, month, deptId);
  const deptIds = Object.keys(byDept);
  if(!deptIds.length){ toast(LANG==='ar'?'لا توجد بيانات لهذا الشهر':'No data for this month'); return; }

  for(const depId of deptIds){
    const dept = STATE.departments.find(d=>d.id===depId);
    const weeks = weekSumsForDept(byDept[depId]);

    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(base64ToArrayBuffer(HOSPITAL_KPI_TEMPLATE_B64));
    const ws = wb.worksheets[0];
    try{ ws.name = (deptName(dept)||'Dept').slice(0,30).replace(/[\[\]\*\/\\\?:]/g,''); }catch(e){}

    for(let w=0; w<4; w++){
      const r = 4+w;
      SHEET_GROUPS.forEach(g=>{
        ws.getCell(`${g.colTotal}${r}`).value = weeks[w][g.total];
        ws.getCell(`${g.colPart}${r}`).value = weeks[w][g.part];
      });
    }
    ws.getCell('AA4').value = deptName(dept);

    const buf = await wb.xlsx.writeBuffer();
    const blob=new Blob([buf], {type:'application/octet-stream'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url;
    a.download = `hospital-kpi-${(dept?.code||deptName(dept)||'dept').replace(/\s+/g,'-')}-${year}-${month}.xlsx`;
    a.click();
    URL.revokeObjectURL(url);
    await new Promise(r=>setTimeout(r,350));
  }
}

  });
  doc.save(`hospital-kpi-${year}-${month}.pdf`);
}




/* ============================================================ EXCEL EXPORT (leaders) — mirrors the uploaded reference workbook */
function topN(rows, keyFn, n){
  const counts={};
  rows.forEach(r=>{ const k=keyFn(r); if(k) counts[k]=(counts[k]||0)+1; });
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,n);
}
function stageCategory(stage){
  if(!stage) return null;
  const m = stage.match(/^\[(.*?)\]/);
  return m? m[1] : stage;
}
// Render a Chart.js chart off-screen and return a PNG data URL
async function chartToImage(cfg, width=560, height=300){
  return new Promise(resolve=>{
    const canvas=document.createElement('canvas');
    canvas.width=width; canvas.height=height;
    canvas.style.position='fixed'; canvas.style.left='-99999px'; canvas.style.top='0';
    document.body.appendChild(canvas);
    const merged = JSON.parse(JSON.stringify(cfg));
    merged.options = Object.assign({responsive:false, animation:false, devicePixelRatio:2}, cfg.options||{});
    const ch = new Chart(canvas, merged);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      const url = canvas.toDataURL('image/png');
      ch.destroy(); canvas.remove();
      resolve(url);
    }));
  });
}
function styleTitle(ws, text, row=1, span=8, color='0B5750'){
  ws.mergeCells(row,1,row,span);
  const c = ws.getCell(row,1);
  c.value = text; c.font={bold:true,size:14,color:{argb:'FFFFFFFF'}};
  c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF'+color}};
  c.alignment={vertical:'middle',horizontal:'center'};
  ws.getRow(row).height=24;
}
function styleSubHeader(ws, text, row, col=1, span=4){
  ws.mergeCells(row,col,row,col+span-1);
  const c = ws.getCell(row,col);
  c.value=text; c.font={bold:true,size:11,color:{argb:'FF0B5750'}};
  c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFE8F5F0'}};
}
function writeTable(ws, startRow, startCol, headers, rows){
  headers.forEach((h,i)=>{
    const c=ws.getCell(startRow,startCol+i);
    c.value=h; c.font={bold:true,color:{argb:'FFFFFFFF'}};
    c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF2A9D8F'}};
    c.alignment={horizontal:'center'};
  });
  rows.forEach((r,ri)=>{
    r.forEach((v,ci)=>{
      const c = ws.getCell(startRow+1+ri, startCol+ci);
      c.value = (v===undefined||v===null)? '' : v;
      c.border={bottom:{style:'thin',color:{argb:'FFE0E0E0'}}};
    });
  });
  return startRow + rows.length + 1; // next free row
}

  toast(LANG==='ar'?'جارِ تجهيز الملف، قد يستغرق لحظات...':'Preparing file, this may take a moment...');
  const {data:rows} = await sb.from('interventions')
    .select('intervention_date,department_id,ward_id,roster_id,roster(full_name),main_drug_generic,main_drug_brand,second_drug_generic,second_drug_brand,is_dtp,problem_type,finding_description,recommendation,reference_used,follow_up,physician_acceptance,is_medication_error,error_stage,error_severity,possible_cause,error_description,action_taken')
    .gte('intervention_date',start).lte('intervention_date',end).order('intervention_date');
  const all=rows||[];
  const dtpRows=all.filter(r=>r.is_dtp);
  const meRows=all.filter(r=>r.is_medication_error);
  // "Od" = Ordering-stage errors (Ordering decision / Ordering Process) — the reference workbook analyses errors excluding this stage separately
  const meOtherThanOd = meRows.filter(r=>!(r.error_stage||'').toLowerCase().includes('ordering'));
  const accept=all.filter(r=>r.physician_acceptance==='Accept').length, reject=all.filter(r=>r.physician_acceptance==='reject').length;
  const dn = id => deptName(STATE.departments.find(d=>d.id===id));

  const wb = new ExcelJS.Workbook();
  wb.creator='Clinical Pharmacy Dashboard'; wb.created=new Date();

  const barCfg=(labels,data,label,color)=>({type:'bar', data:{labels, datasets:[{label, data, backgroundColor:color}]}, options:{plugins:{legend:{display:false},title:{display:true,text:label}}, scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});
  const pieCfg=(labels,data,label,colors)=>({type:'pie', data:{labels, datasets:[{data, backgroundColor:colors}]}, options:{plugins:{legend:{position:'bottom'},title:{display:true,text:label}}}});

  /* ============ Sheet 1: Total reports overview ============ */
  {
    const ws = wb.addWorksheet('Total reports overview');
    ws.columns=[{width:26},{width:16},{width:12},{width:18}];
    styleTitle(ws,'Total Reports Overview',1,4);
    const byDept={}; STATE.departments.forEach(d=>byDept[d.id]={name:deptName(d),total:0,dtp:0,me:0});
    all.forEach(r=>{ if(!byDept[r.department_id]) return; byDept[r.department_id].total++; if(r.is_dtp)byDept[r.department_id].dtp++; if(r.is_medication_error)byDept[r.department_id].me++; });
    let row = writeTable(ws,3,1,['Department','Total Reports','DTP','Medication Errors'], Object.values(byDept).map(d=>[d.name,d.total,d.dtp,d.me]));
    writeTable(ws,row+1,1,['Metric','Value'],[
      ['Total Reports', all.length],['Total DTP', dtpRows.length],['Total Medication Errors', meRows.length],
      ['Accepted', accept],['Rejected', reject],
      ['Acceptance Rate %', (accept+reject)? Math.round(accept/(accept+reject)*100):0],
    ]);
    const img = await chartToImage(barCfg(Object.values(byDept).map(d=>d.name), Object.values(byDept).map(d=>d.total), 'Total Reports per Department', '#2A9D8F'));
    const imgId = wb.addImage({base64:img, extension:'png'});
    ws.addImage(imgId, {tl:{col:5,row:2}, ext:{width:520,height:280}});
  }

  /* ============ Sheet 2: All DTP ============ */
  {
    const ws = wb.addWorksheet('All DTP');
    ws.columns=[{width:12},{width:16},{width:16},{width:20},{width:18},{width:30},{width:30},{width:30},{width:26},{width:18},{width:16}];
    styleTitle(ws,'All Drug Therapy Problems — Basic Statistical Analysis',1,11);

    const byDeptDTP = STATE.departments.map(d=>[deptName(d), dtpRows.filter(r=>r.department_id===d.id).length]);
    const byType = topN(dtpRows, r=>r.problem_type, 12);
    const byDrug = topN(dtpRows, r=>r.main_drug_generic, 12);
    const drugInteraction = dtpRows.filter(r=>(r.problem_type||'').toLowerCase().includes('drug interaction'));

    styleSubHeader(ws,'Table 1: DTPs in Different Departments',3,1,3);
    let r1 = writeTable(ws,4,1,['Department','Count'], byDeptDTP);
    styleSubHeader(ws,'Table 2: DTP Common Types',3,4,3);
    writeTable(ws,4,4,['Problem Type','Count'], byType);
    styleSubHeader(ws,'Table 3: Medications Commonly Involved',3,7,2);
    writeTable(ws,4,7,['Drug','Count'], byDrug);

    let nextRow = Math.max(r1, 4+byType.length+2, 4+byDrug.length+2) + 1;
    styleSubHeader(ws, 'Table 4: Involved Drugs Associated with Drug Interactions', nextRow, 1, 6);
    nextRow = writeTable(ws, nextRow+1, 1, ['Date','Department','Main Drug','Finding','Recommendation'],
      drugInteraction.map(r=>[r.intervention_date, dn(r.department_id), r.main_drug_generic||'', r.finding_description||'', r.recommendation||'']));

    styleSubHeader(ws,'All DTP Records',nextRow+1,1,7);
    writeTable(ws,nextRow+2,1,['Date','Department','Pharmacist','Main Drug (Generic)','Main Drug (Brand)','Problem Type','Finding','Recommendation','Reference','Follow Up','Decision'],
      dtpRows.map(r=>[r.intervention_date, dn(r.department_id), r.roster?.full_name||'', r.main_drug_generic||'', r.main_drug_brand||'', r.problem_type||'', r.finding_description||'', r.recommendation||'', r.reference_used||'', r.follow_up||'', r.physician_acceptance||'']));

    const img1=await chartToImage(barCfg(byDeptDTP.map(x=>x[0]), byDeptDTP.map(x=>x[1]),'DTPs in Different Departments','#2A9D8F'));
    const img2=await chartToImage(barCfg(byType.map(x=>x[0].slice(0,26)), byType.map(x=>x[1]),'DTP Common Types','#E9C46A'));
    const img3=await chartToImage(barCfg(byDrug.map(x=>x[0]), byDrug.map(x=>x[1]),'Medications Commonly Involved','#E76F51'));
    [img1,img2,img3].forEach((img,i)=>{ const id=wb.addImage({base64:img,extension:'png'}); ws.addImage(id,{tl:{col:1+i*5, row: nextRow+3}, ext:{width:420,height:250}}); });
  }

  /* ============ Sheet 3: All DTP Further Analysis ============ */
  {
    const ws = wb.addWorksheet('All DTP Further Analysis');
    ws.columns=[{width:24}]; for(let i=0;i<10;i++) ws.getColumn(i+2).width=12;
    styleTitle(ws,'All Drug Therapy Problems — Further Analysis',1,10);
    const topDrugs = topN(dtpRows, r=>r.main_drug_generic, 10).map(x=>x[0]);
    const topTypes = topN(dtpRows, r=>r.problem_type, 6).map(x=>x[0]);
    styleSubHeader(ws,'Cross-tab: Drug × DTP Type (counts)',3,1,10);
    const header=['Drug', ...topTypes.map(t=>t.length>20?t.slice(0,20)+'…':t)];
    const matrix = topDrugs.map(drug=>{
      const row=[drug];
      topTypes.forEach(type=>{ row.push(dtpRows.filter(r=>r.main_drug_generic===drug && r.problem_type===type).length); });
      return row;
    });
    writeTable(ws,4,1,header,matrix);
    const img=await chartToImage(barCfg(topDrugs,topDrugs.map(d=>dtpRows.filter(r=>r.main_drug_generic===d).length),'Drugs Commonly Involved','#2A9D8F'));
    const id=wb.addImage({base64:img,extension:'png'});
    ws.addImage(id,{tl:{col:0,row:4+matrix.length+3}, ext:{width:520,height:280}});
  }

  /* ============ Sheet 4: Total ME overview ============ */
  {
    const ws = wb.addWorksheet('Total ME overview');
    ws.columns=[{width:14},{width:20},{width:18},{width:30},{width:16},{width:24},{width:34},{width:30}];
    styleTitle(ws,'Medication Errors in All Stages',1,8);
    const stageOrder=['Ordering decision','Ordering Process','Preparation','Storage','Transcribing','Dispensing','Administration','Monitoring'];
    const stageFreq={}; meRows.forEach(r=>{ const cat=stageCategory(r.error_stage)||'Other'; stageFreq[cat]=(stageFreq[cat]||0)+1; });
    const orderedStages = stageOrder.filter(s=>stageFreq[s]!==undefined);
    const extraStages = Object.keys(stageFreq).filter(s=>!stageOrder.includes(s));
    const stageList=[...orderedStages, ...extraStages];
    let row = writeTable(ws,3,1,['Stage','Frequency'], stageList.map(s=>[s,stageFreq[s]]).concat([['Total', meRows.length]]));

    const severityFreq={}; meRows.forEach(r=>{ if(r.error_severity) severityFreq[r.error_severity]=(severityFreq[r.error_severity]||0)+1; });
    styleSubHeader(ws,'Severity Breakdown', row+1, 1, 2);
    row = writeTable(ws, row+2, 1, ['Severity','Count'], Object.entries(severityFreq));

    styleSubHeader(ws,'All Medication Error Records', row+1,1,8);
    writeTable(ws,row+2,1,['Date','Department','Pharmacist','Stage','Severity','Possible Cause','Error Description','Action Taken'],
      meRows.map(r=>[r.intervention_date, dn(r.department_id), r.roster?.full_name||'', r.error_stage||'', r.error_severity||'', r.possible_cause||'', r.error_description||'', r.action_taken||'']));

    const img1=await chartToImage(barCfg(stageList, stageList.map(s=>stageFreq[s]),'Medication Errors in All Stages','#E76F51'));
    const img2=await chartToImage(pieCfg(Object.keys(severityFreq), Object.values(severityFreq),'Severity Distribution', ['#2A9D8F','#E9C46A','#E76F51','#8AB17D','#F4A261','#264653','#B5838D','#457B9D']));
    const id1=wb.addImage({base64:img1,extension:'png'}); ws.addImage(id1,{tl:{col:9,row:2}, ext:{width:460,height:260}});
    const id2=wb.addImage({base64:img2,extension:'png'}); ws.addImage(id2,{tl:{col:9,row:18}, ext:{width:420,height:260}});
  }

  /* ============ Sheet 5: ME other than Od ============ */
  {
    const ws = wb.addWorksheet('ME other than Od');
    ws.columns=[{width:26},{width:16}];
    styleTitle(ws,'Medication Errors (Other than Ordering) — Basic Statistics',1,8);
    const byDeptME = STATE.departments.map(d=>[deptName(d), meOtherThanOd.filter(r=>r.department_id===d.id).length]);
    const byTypeME = {}; meOtherThanOd.forEach(r=>{ const cat=stageCategory(r.error_stage)||'Other'; byTypeME[cat]=(byTypeME[cat]||0)+1; });
    const byDrugME = topN(meOtherThanOd, r=>r.main_drug_generic, 12);
    const byCauseME = topN(meOtherThanOd, r=>r.possible_cause, 12);
    const bySevME = {}; meOtherThanOd.forEach(r=>{ if(r.error_severity) bySevME[r.error_severity]=(bySevME[r.error_severity]||0)+1; });

    styleSubHeader(ws,'Table 1: Medication Errors in Different Departments',3,1,2);
    let r1=writeTable(ws,4,1,['Department','Count'], byDeptME);
    styleSubHeader(ws,'Table 2: Type of Errors',3,4,2);
    writeTable(ws,4,4,['Error Category','Count'], Object.entries(byTypeME));
    styleSubHeader(ws,'Table 3: Main Drug Involved',3,7,2);
    writeTable(ws,4,7,['Drug','Count'], byDrugME);
    let nextRow = Math.max(r1, 4+Object.keys(byTypeME).length+2, 4+byDrugME.length+2) + 1;
    styleSubHeader(ws,'Table 4: Possible Causes',nextRow,1,2);
    let r2=writeTable(ws,nextRow+1,1,['Cause','Count'], byCauseME);
    styleSubHeader(ws,'Table 5: Error Category / Severity',nextRow,4,2);
    writeTable(ws,nextRow+1,4,['Severity','Count'], Object.entries(bySevME));

    const chartRow = Math.max(r2, nextRow+1+Object.keys(bySevME).length+2) + 1;
    const img1=await chartToImage(barCfg(byDeptME.map(x=>x[0]), byDeptME.map(x=>x[1]),'MEs in Different Departments','#E76F51'));
    const img2=await chartToImage(pieCfg(Object.keys(byTypeME), Object.values(byTypeME),'Type of Errors', ['#2A9D8F','#E9C46A','#E76F51','#8AB17D','#F4A261','#264653','#B5838D']));
    const img3=await chartToImage(barCfg(byDrugME.map(x=>x[0]), byDrugME.map(x=>x[1]),'Main Drug Involved','#264653'));
    [img1,img2,img3].forEach((img,i)=>{ const id=wb.addImage({base64:img,extension:'png'}); ws.addImage(id,{tl:{col:i*6, row: chartRow}, ext:{width:400,height:250}}); });
  }

  /* ============ Sheet 6: ME other than Od Further analysis ============ */
  {
    const ws = wb.addWorksheet('ME other than Od Further analysis');
    ws.columns=[{width:24}]; for(let i=0;i<8;i++) ws.getColumn(i+2).width=14;
    styleTitle(ws,'Medication Errors (Other than Ordering) — Further Analysis',1,8);
    const topDrugsME = topN(meOtherThanOd, r=>r.main_drug_generic, 10).map(x=>x[0]);
    const topStagesME = [...new Set(meOtherThanOd.map(r=>stageCategory(r.error_stage)).filter(Boolean))].slice(0,6);
    styleSubHeader(ws,'Cross-tab: Drug × Error Type (counts)',3,1,8);
    const header=['Drug', ...topStagesME];
    const matrix = topDrugsME.map(drug=>{
      const row=[drug];
      topStagesME.forEach(stage=>{ row.push(meOtherThanOd.filter(r=>r.main_drug_generic===drug && stageCategory(r.error_stage)===stage).length); });
      return row;
    });
    writeTable(ws,4,1,header,matrix);
    const img=await chartToImage(barCfg(topDrugsME, topDrugsME.map(d=>meOtherThanOd.filter(r=>r.main_drug_generic===d).length),'Main Drug Involved (Other than Ordering)','#E76F51'));
    const id=wb.addImage({base64:img,extension:'png'});
    ws.addImage(id,{tl:{col:0,row:4+matrix.length+3}, ext:{width:520,height:280}});
  }

  /* ============ Sheet 7: KPIs ============ */
  {
    const ws = wb.addWorksheet('KPIs');
    ws.columns=[{width:26},{width:16}];
    styleTitle(ws,'Clinical Pharmacy KPIs (General or Department Specific)',1,8);
    const byPharm = topN(all, r=>r.roster?.full_name, 20);
    const byPharmME = topN(meOtherThanOd, r=>r.roster?.full_name, 20);
    const byRef = topN(all, r=>r.reference_used, 15);

    styleSubHeader(ws,'Table 1: Acceptance',3,1,2);
    let r1=writeTable(ws,4,1,['Decision','Count'], [['Accepted',accept],['Rejected',reject]]);
    styleSubHeader(ws,'Table 2: Total Reports per Pharmacist',3,4,2);
    let r2=writeTable(ws,4,4,['Pharmacist','Total Reports'], byPharm);
    styleSubHeader(ws,'Table 2.1: MEs Detection (other than Ordering) per Pharmacist',3,7,2);
    let r3=writeTable(ws,4,7,['Pharmacist','ME Count'], byPharmME);

    let nextRow = Math.max(r1,r2,r3) + 1;
    styleSubHeader(ws,'Top References Used', nextRow, 1, 2);
    writeTable(ws, nextRow+1, 1, ['Reference','Count'], byRef);

    const img1=await chartToImage(pieCfg(['Accepted','Rejected'],[accept,reject],'Acceptance', ['#2A9D8F','#E76F51']));
    const img2=await chartToImage(barCfg(byPharm.map(x=>x[0]), byPharm.map(x=>x[1]),'Total Reports per Pharmacist','#2A9D8F'));
    const img3=await chartToImage(barCfg(byPharmME.map(x=>x[0]), byPharmME.map(x=>x[1]),'MEs Detection per Pharmacist','#E76F51'));
    const id1=wb.addImage({base64:img1,extension:'png'}); ws.addImage(id1,{tl:{col:0,row:nextRow+2+byRef.length}, ext:{width:380,height:260}});
    const id2=wb.addImage({base64:img2,extension:'png'}); ws.addImage(id2,{tl:{col:6,row:nextRow+2+byRef.length}, ext:{width:420,height:260}});
    const id3=wb.addImage({base64:img3,extension:'png'}); ws.addImage(id3,{tl:{col:12,row:nextRow+2+byRef.length}, ext:{width:420,height:260}});
  }

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=`Clinical_Pharmacy_KPIs_${start}_to_${end}.xlsx`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast(LANG==='ar'?'تم تحميل الملف ✅':'File downloaded ✅');
}

/* ============================================================ POLICIES (file upload, backed by Supabase Storage) */
function fileIcon(type){
  if(!type) return '📄';
  if(type.includes('pdf')) return '📕';
  if(type.includes('word')||type.includes('msword')||type.includes('officedocument.wordprocessingml')) return '📘';
  if(type.includes('presentation')||type.includes('powerpoint')) return '📙';
  if(type.includes('sheet')||type.includes('excel')) return '📗';
  if(type.startsWith('image/')) return '🖼️';
  return '📄';
}
function humanSize(b){
  if(!b) return '';
  if(b<1024) return b+' B';
  if(b<1024*1024) return Math.round(b/1024)+' KB';
  return (b/1024/1024).toFixed(1)+' MB';
}
async function downloadDoc(path, name){
  const {data,error} = await sb.storage.from('documents').createSignedUrl(path, 60);
  if(error){ toast(LANG==='ar'?'تعذر فتح الملف':'Could not open file'); console.error(error); return; }
  window.open(data.signedUrl, '_blank');
}
/* ============================================================ DOC SECTIONS (Policies + Notes share one folder/document browser) */
function docFolderState(section){ return section==='policies' ? 'policiesFolder' : 'notesFolder'; }
async function renderDocSection(section, mountEl){
  const c = mountEl || $('#content');
  const stateKey = docFolderState(section);
  const parentId = STATE[stateKey] || null;
  const {data:items} = await sb.from('doc_items').select('*').eq('section',section).eq('parent_id', parentId).order('type').order('created_at',{ascending:false});
  const list = items||[];
  let crumbHtml = '';
  if(parentId){
    const {data:folder} = await sb.from('doc_items').select('title,parent_id').eq('id',parentId).single();
    crumbHtml = `<button class="back-link" onclick="STATE.${stateKey}=${folder?.parent_id?`'${folder.parent_id}'`:'null'}; renderView();">→ ${t('back_notes')}</button><div class="page-sub" style="margin:2px 0 10px;">📁 ${esc(folder?.title||'')}</div>`;
  }
  c.innerHTML=`
    ${crumbHtml}
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;">
      <div><h2 class="page-title">${t(section)}</h2><p class="page-sub">${section==='policies' ? (LANG==='ar'?'مستندات السياسات والإجراءات':'Policy and procedure documents') : (LANG==='ar'?'ملفات وملاحظات الفريق':'Team files and notes')}</p></div>
      ${STATE.isLeader? `
        <div style="display:flex;gap:8px;">
          <button class="btn-outline" id="doc-newfolder-btn" style="width:auto;">📁 ${t('new_folder')}</button>
          <button class="btn-primary" id="doc-upload-btn" style="width:auto;">⬆ ${t('upload_doc')}</button>
          <input type="file" id="doc-file-input" style="display:none;">
        </div>` : ''}
    </div>
    <div class="card" id="doc-list">
      ${list.length? list.map(it=>`
        <div class="pharm-row doc-item-row" data-id="${it.id}" data-type="${it.type}" data-path="${esc(it.file_path||'')}" data-name="${esc(it.title)}">
          <div class="av" style="background:var(--mint-bg);">${it.type==='folder'?'📁':fileIcon(it.file_type)}</div>
          <div style="flex:1;">
            <b style="font-size:14px;">${esc(it.title)}</b>
            ${it.type==='document'? `<div style="font-size:12px;color:var(--muted);">${humanSize(it.size_bytes)} · ${new Date(it.created_at).toLocaleDateString(LANG==='ar'?'ar-EG':'en-US')}</div>`:''}
          </div>
          ${STATE.isLeader? `<button class="btn-outline del-doc-item" data-id="${it.id}" data-path="${esc(it.file_path||'')}" style="color:#D65C4A;border-color:#D65C4A;font-size:12px;padding:5px 10px;">🗑</button>`:''}
        </div>`).join('') : `<div class="empty-state"><div class="ic">📁</div>${t('no_docs')}</div>`}
    </div>
    ${STATE.isLeader? `<p class="page-sub" style="margin-top:14px;">🔗 ${t('drive_note')}</p>` : ''}
  `;
  $$('.doc-item-row').forEach(el=>el.onclick=(e)=>{
    if(e.target.closest('.del-doc-item')) return;
    if(el.dataset.type==='folder'){ STATE[stateKey]=el.dataset.id; renderView(); }
    else { downloadDoc(el.dataset.path, el.dataset.name); }
  });
  $$('.del-doc-item').forEach(btn=>btn.onclick=async(e)=>{
    e.stopPropagation();
    if(!confirm(t('delete_confirm'))) return;
    if(btn.dataset.path) await sb.storage.from('documents').remove([btn.dataset.path]);
    await sb.from('doc_items').delete().eq('id', btn.dataset.id);
    renderView();
  });
  if(STATE.isLeader){
    $('#doc-newfolder-btn').onclick=async()=>{
      const name=prompt(t('folder_name_ph'));
      if(!name||!name.trim()) return;
      const {error} = await sb.from('doc_items').insert({section, parent_id:parentId, type:'folder', title:name.trim(), created_by:STATE.profile.id});
      if(error){ toast(LANG==='ar'?'تعذر الإنشاء':'Could not create'); console.error(error); return; }
      renderView();
    };
    $('#doc-upload-btn').onclick=()=>$('#doc-file-input').click();
    $('#doc-file-input').onchange=async(e)=>{
      const file=e.target.files[0]; if(!file) return;
      toast(t('uploading'));
      const path = `${section}/${crypto.randomUUID()}-${file.name}`;
      const {error:upErr} = await sb.storage.from('documents').upload(path, file);
      if(upErr){ toast(LANG==='ar'?'تعذر رفع الملف':'Could not upload'); console.error(upErr); return; }
      const {error:dbErr} = await sb.from('doc_items').insert({section, parent_id:parentId, type:'document', title:file.name, file_path:path, file_type:file.type, size_bytes:file.size, created_by:STATE.profile.id});
      if(dbErr){ console.error(dbErr); }
      toast(t('uploaded_ok')); renderView();
    };
  }
}
function renderPolicies(){ return renderDocSection('policies'); }
async function renderNotes(){
  const c=$('#content');
  c.innerHTML = `<div id="notes-docs-mount"></div><div style="height:10px;"></div><div id="quick-notes-mount"></div>`;
  await renderDocSection('notes', $('#notes-docs-mount'));
  await renderQuickNotes($('#quick-notes-mount'));
}

const NOTE_COLORS = {

function colorSwatchPicker(selectedColor){
