    return `<div class="qn-swatch" data-color="${k}" title="${LANG==='ar'?cc.label_ar:cc.label_en}" style="width:34px;height:34px;border-radius:50%;background:${cc.fg};cursor:pointer;display:inline-flex;align-items:center;justify-content:center;border:3px solid ${sel?cc.fg:'transparent'};box-shadow:0 0 0 2px ${sel? cc.bg : 'transparent'};">${sel?'<span style="color:#fff;font-size:14px;">✓</span>':''}</div>`;
  }).join('');
}
function openQuickNoteModal(existing){
  const overlay=document.createElement('div'); overlay.className='modal-overlay';
  let chosenColor = existing?.color || 'blue';
  overlay.innerHTML=`
    <div class="modal modal-pos">
      <button class="btn-outline close" style="position:absolute;left:18px;top:18px;">✕</button>
      <h3>${existing? (LANG==='ar'?'تعديل ملاحظة':'Edit Note') : (LANG==='ar'?'إضافة ملاحظة جديدة':'Add New Note')}</h3>
      <div class="field"><label>${LANG==='ar'?'اسم الملاحظة':'Note title'}</label><input type="text" id="qn-title" value="${existing?esc(existing.title):''}" placeholder="${LANG==='ar'?'اسم الملاحظة':'Note title'}"></div>
      <div class="field"><label>${LANG==='ar'?'اللون':'Color'}</label><div id="qn-swatches" style="display:flex;gap:10px;margin-top:6px;">${colorSwatchPicker(chosenColor)}</div></div>
      <div class="field"><label>${LANG==='ar'?'تفاصيل الملاحظة':'Note details'}</label><textarea id="qn-details" rows="5" placeholder="${LANG==='ar'?'اكتب التفاصيل هنا...':'Write the details here...'}">${existing?esc(existing.details||''):''}</textarea></div>
      <div class="formrow">
        <button class="btn-outline" id="qn-cancel">${t('cancel')}</button>
        <button class="btn-primary" id="qn-create">${existing? t('save') : (LANG==='ar'?'إنشاء':'Create')}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('.close').onclick=()=>overlay.remove();
  overlay.onclick=(e)=>{if(e.target===overlay)overlay.remove();};
  overlay.querySelector('#qn-cancel').onclick=()=>overlay.remove();
  function rebindSwatches(){
    overlay.querySelectorAll('.qn-swatch').forEach(s2=>{ s2.onclick = ()=>{ chosenColor=s2.dataset.color; overlay.querySelector('#qn-swatches').innerHTML = colorSwatchPicker(chosenColor); rebindSwatches(); }; });

    if(!title){ toast(LANG==='ar'?'اكتب اسم الملاحظة':'Enter a note title'); return; }

    }
    overlay.remove();
    toast(LANG==='ar'?'تم الحفظ ✅':'Saved ✅');
    if(['notes','home'].includes(STATE.view)) renderView();
  };

/* ============================================================ CALENDAR */
async function renderCalendar(){
  const c=$('#content');
  const y=STATE.calYear, m=STATE.calMonth;
  const first=new Date(y,m,1); const startOffset=first.getDay(); const daysInMonth=new Date(y,m+1,0).getDate();
  const monthNames= LANG==='ar' ? ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'] : ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const monthStart=new Date(y,m,1).toISOString().slice(0,10); const monthEnd=new Date(y,m+1,0).toISOString().slice(0,10);
  const {data:events} = await sb.from('calendar_events').select('*').gte('event_date',monthStart).lte('event_date',monthEnd).order('event_date');
  const evByDay={}; (events||[]).forEach(e=>{const d=new Date(e.event_date).getDate(); (evByDay[d]=evByDay[d]||[]).push(e);});
  const todayStr=new Date().toDateString();

  let cells='';
  for(let i=0;i<startOffset;i++) cells+=`<div class="cal-day empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const isToday = new Date(y,m,d).toDateString()===todayStr;
    const evs=evByDay[d]||[];
    cells+=`<div class="cal-day ${isToday?'today':''}" data-day="${d}"><div class="dnum">${d}</div>
      ${evs.slice(0,2).map(e=>`<span class="evt-dot">${esc(e.title)}</span>`).join('')}
      ${evs.length>2?`<span class="evt-dot">+${evs.length-2}</span>`:''}</div>`;
  }
  const dow = LANG==='ar' ? ['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'] : ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  c.innerHTML=`
    <h2 class="page-title">${t('calendar')}</h2>
    <p class="page-sub">${t('calendar_sub')}</p>
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
        <button class="btn-outline" id="cal-prev">‹ ${t('prev')}</button>
        <b>${monthNames[m]} ${y}</b>
        <button class="btn-outline" id="cal-next">${t('next')} ›</button>
      </div>
      <div class="cal-grid">${dow.map(d=>`<div class="cal-head">${d}</div>`).join('')}${cells}</div>
    </div>`;
  $('#cal-prev').onclick=()=>{STATE.calMonth--; if(STATE.calMonth<0){STATE.calMonth=11;STATE.calYear--;} renderView();};
  $('#cal-next').onclick=()=>{STATE.calMonth++; if(STATE.calMonth>11){STATE.calMonth=0;STATE.calYear++;} renderView();};
  $$('.cal-day[data-day]').forEach(el=>el.onclick=()=>openDayModal(parseInt(el.dataset.day), evByDay[parseInt(el.dataset.day)]||[]));
}

            <div><b style="font-size:13px;">${esc(e.title)}</b><div style="color:var(--muted);font-size:11.5px;">${esc(e.description||'')}</div></div>

      </div>
      <div class="field"><label>${LANG==='ar'?'عنوان الحدث':'Event title'}</label><input type="text" id="ev-title"></div>
      <div class="field"><label>${LANG==='ar'?'وصف (اختياري)':'Description (optional)'}</label><input type="text" id="ev-desc"></div>

    </div>`;
  document.body.appendChild(overlay);

  overlay.onclick=(e)=>{if(e.target===overlay) overlay.remove();};
  overlay.querySelectorAll('.del-evt').forEach(b=>b.onclick=async()=>{ await sb.from('calendar_events').delete().eq('id', b.dataset.id); overlay.remove(); renderView(); });
  overlay.querySelector('#ev-save').onclick=async()=>{
    const title=$('#ev-title',overlay).value.trim();

    const {error} = await sb.from('calendar_events').insert({title, description:$('#ev-desc',overlay).value.trim(), event_date:dateStr, created_by:STATE.profile.id});
    if(error){toast(LANG==='ar'?'حدث خطأ':'Something went wrong');return;}
    overlay.remove(); toast(LANG==='ar'?'تمت إضافة الحدث':'Event added'); renderView();
  };
}

function prefillIntervention(ov, r){
  const setV=(sel,v)=>{ const el=$(sel,ov); if(el && v!==null && v!==undefined) el.value=v; };
  const setSel=(sel,v)=>{ const el=$(sel,ov); if(!el || v===null || v===undefined || v==='') return; if(![...el.options].some(o=>o.value===v)) el.add(new Option(v,v)); el.value=v; };
  const setList=(sel,list,v,lk)=>{ if(!v) return; const f=list.find(x=>x.id===v)||list.find(x=>x[lk]===v); setSel(sel, f? f.id : v); };
  setSel('#iv-ward', r.ward_id); setV('#iv-patient', r.patient_info);
  setSel('#iv-drug1g', r.main_drug_generic); setSel('#iv-drug1b', r.main_drug_brand);
  setSel('#iv-drug2g', r.second_drug_generic); setSel('#iv-drug2b', r.second_drug_brand);
  $('#iv-isdtp',ov).checked=!!r.is_dtp; $('#dtp-block',ov).style.display=r.is_dtp?'block':'none';
  setList('#iv-problem', STATE.problemTypes, r.problem_type, 'label'); setV('#iv-finding', r.finding_description); setV('#iv-rec', r.recommendation);
  setList('#iv-ref', STATE.refs, r.reference_used, 'name'); setSel('#iv-accept', r.physician_acceptance); setV('#iv-followup', r.follow_up);
  $('#iv-isme',ov).checked=!!r.is_medication_error; $('#me-block',ov).style.display=r.is_medication_error?'block':'none';
  setList('#iv-stage', STATE.stages, r.error_stage, 'label'); setList('#iv-severity', STATE.severities, r.error_severity, 'label'); setList('#iv-cause', STATE.causes, r.possible_cause, 'label');

}

      </div>
      <div class="checkbox-row"><input type="checkbox" id="iv-isdtp"><label for="iv-isdtp">DTP</label></div>
      <div id="dtp-block" class="conditional-block" style="display:none;">
        <div class="field"><label>${LANG==='ar'?'نوع المشكلة':'Problem type'}</label><select id="iv-problem">${optionsHtml(STATE.problemTypes,'id','label')}</select></div>
        <div class="field"><label>${LANG==='ar'?'وصف الملاحظة':'Finding'}</label><textarea id="iv-finding" rows="2"></textarea></div>
        <div class="field"><label>${LANG==='ar'?'التوصية':'Recommendation'}</label><textarea id="iv-rec" rows="2"></textarea></div>
        <div class="formrow">
          <div class="field"><label>${LANG==='ar'?'المرجع':'Reference'}</label><select id="iv-ref"><option value="">—</option>${optionsHtml(STATE.refs,'id','name')}</select></div>
          <div class="field"><label>${LANG==='ar'?'قرار الطبيب':'Physician decision'}</label><select id="iv-accept"><option value="">—</option><option value="Accept">${LANG==='ar'?'قبول':'Accept'}</option><option value="reject">${LANG==='ar'?'رفض':'Reject'}</option></select></div>
        </div>
        <div class="field"><label>${LANG==='ar'?'المتابعة':'Follow up'}</label><input type="text" id="iv-followup"></div>
      </div>
      <div class="checkbox-row"><input type="checkbox" id="iv-isme"><label for="iv-isme">${t('total_me')}</label></div>
      <div id="me-block" class="conditional-block" style="display:none;">
        <div class="formrow">
          <div class="field"><label>${LANG==='ar'?'مرحلة الخطأ':'Stage'}</label><select id="iv-stage">${optionsHtml(STATE.stages,'id','label')}</select></div>
          <div class="field"><label>${LANG==='ar'?'الخطورة':'Severity'}</label><select id="iv-severity">${optionsHtml(STATE.severities,'id','label')}</select></div>
        </div>
        <div class="field"><label>${LANG==='ar'?'السبب المحتمل':'Possible cause'}</label><select id="iv-cause">${optionsHtml(STATE.causes,'id','label')}</select></div>
        <div class="field"><label>${LANG==='ar'?'وصف الخطأ':'Error description'}</label><textarea id="iv-errdesc" rows="2"></textarea></div>
        <div class="field"><label>${LANG==='ar'?'الإجراء المتخذ':'Action taken'}</label><textarea id="iv-action" rows="2"></textarea></div>
      </div>
      <button class="btn-primary" id="iv-save">${t('save')}</button>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('.close').onclick=()=>overlay.remove();
  overlay.onclick=(e)=>{if(e.target===overlay) overlay.remove();};

  $('#iv-isdtp',overlay).onchange=(e)=>{$('#dtp-block',overlay).style.display=e.target.checked?'block':'none';};
  $('#iv-isme',overlay).onchange=(e)=>{$('#me-block',overlay).style.display=e.target.checked?'block':'none';};
  if(existing) prefillIntervention(overlay, existing);

  $('#iv-save',overlay).onclick=async()=>{
    if(!existing && (!myDeptId || !STATE.profile.roster_id)){toast(LANG==='ar'?'حسابك غير مرتبط بقسم/اسم بعد، تواصل مع القائد':'Your account has no department/name linked yet'); return;}
    const btn=$('#iv-save',overlay); btn.disabled=true; btn.textContent='...';
    const payload={
      department_id: myDeptId, ward_id: $('#iv-ward',overlay).value||null, roster_id: STATE.profile.roster_id,
      submitted_by: STATE.profile.id, patient_info: $('#iv-patient',overlay).value||null,
      main_drug_generic: $('#iv-drug1g',overlay).value||null, main_drug_brand: $('#iv-drug1b',overlay).value||null,
      second_drug_generic: $('#iv-drug2g',overlay).value||null, second_drug_brand: $('#iv-drug2b',overlay).value||null,
      is_dtp: $('#iv-isdtp',overlay).checked,
      problem_type: $('#iv-isdtp',overlay).checked ? ($('#iv-problem',overlay).value||null) : null,
      finding_description: $('#iv-isdtp',overlay).checked ? ($('#iv-finding',overlay).value||null) : null,
      recommendation: $('#iv-isdtp',overlay).checked ? ($('#iv-rec',overlay).value||null) : null,
      reference_used: $('#iv-isdtp',overlay).checked ? ($('#iv-ref',overlay).value||null) : null,
      physician_acceptance: $('#iv-isdtp',overlay).checked ? ($('#iv-accept',overlay).value||null) : null,
      follow_up: $('#iv-isdtp',overlay).checked ? ($('#iv-followup',overlay).value||null) : null,
      is_medication_error: $('#iv-isme',overlay).checked,
      error_stage: $('#iv-isme',overlay).checked ? ($('#iv-stage',overlay).value||null) : null,
      error_severity: $('#iv-isme',overlay).checked ? ($('#iv-severity',overlay).value||null) : null,
      possible_cause: $('#iv-isme',overlay).checked ? ($('#iv-cause',overlay).value||null) : null,
      error_description: $('#iv-isme',overlay).checked ? ($('#iv-errdesc',overlay).value||null) : null,
      action_taken: $('#iv-isme',overlay).checked ? ($('#iv-action',overlay).value||null) : null,
    };
    let error;
    if(existing){
      delete payload.department_id; delete payload.roster_id; delete payload.submitted_by;
      const res = await sb.from('interventions').update(payload).eq('id', existing.id).select('id');
      error = res.error || ((res.data && res.data.length) ? null : {message:'no rows updated (permission?)'});
    } else {
      ({error} = await sb.from('interventions').insert(payload));
    }
    btn.disabled=false; btn.textContent=t('save');
    if(error){toast(LANG==='ar'?'تعذر الحفظ':'Could not save'); console.error(error); return;}
    overlay.remove(); toast(LANG==='ar'?'تم الحفظ بنجاح ✅':'Saved successfully ✅');
    refreshAfterIvChange();
  };
}

/* ============================================================ MONTH INTERVENTIONS MODAL (click on Total KPI) */
async function openMonthInterventionsModal(){
  const now=new Date();
  const monthStart=new Date(now.getFullYear(), now.getMonth(),1).toISOString().slice(0,10);
  const monthEnd=new Date(now.getFullYear(), now.getMonth()+1,0).toISOString().slice(0,10);
  const {data:rows} = await sb.from('interventions')
    .select('intervention_date,main_drug_generic,is_dtp,is_medication_error,physician_acceptance,department_id,roster(full_name)')
    .gte('intervention_date',monthStart).lte('intervention_date',monthEnd)
    .order('intervention_date',{ascending:false});
  const all=rows||[];
  const overlay=document.createElement('div'); overlay.className='modal-overlay';
  overlay.innerHTML=`
    <div class="modal modal-pos" style="max-width:720px;">
      <button class="btn-outline close" style="position:absolute;left:18px;top:18px;">✕</button>
      <h3>${t('month_all_iv')} — ${now.toLocaleDateString(LANG==='ar'?'ar-EG':'en-US',{month:'long',year:'numeric'})}</h3>
      <div style="max-height:60vh;overflow:auto;margin-top:10px;">
        ${all.length? `<table style="width:100%;border-collapse:collapse;font-size:13px;">
          <thead><tr style="text-align:${LANG==='ar'?'right':'left'};color:var(--muted);">
            <th style="padding:8px 6px;">${LANG==='ar'?'التاريخ':'Date'}</th>
            <th style="padding:8px 6px;">${LANG==='ar'?'القسم':'Dept'}</th>
            <th style="padding:8px 6px;">${LANG==='ar'?'الصيدلي':'Pharmacist'}</th>
            <th style="padding:8px 6px;">${LANG==='ar'?'الدواء':'Drug'}</th>
            <th style="padding:8px 6px;">DTP</th>
            <th style="padding:8px 6px;">${t('total_me')}</th>
          </tr></thead>
          <tbody>${all.map(r=>`<tr style="border-top:1px solid var(--line);">
            <td style="padding:8px 6px;">${r.intervention_date}</td>
            <td style="padding:8px 6px;">${esc(deptName(STATE.departments.find(d=>d.id===r.department_id)))}</td>
            <td style="padding:8px 6px;">${esc(r.roster?.full_name||'—')}</td>
            <td style="padding:8px 6px;">${esc(r.main_drug_generic||'—')}</td>
            <td style="padding:8px 6px;">${r.is_dtp? '✅':'—'}</td>
            <td style="padding:8px 6px;">${r.is_medication_error? '⚠️':'—'}</td>
          </tr>`).join('')}</tbody>
        </table>` : `<div class="empty-state"><div class="ic">📭</div>${LANG==='ar'?'لا توجد تداخلات هذا الشهر':'No interventions this month'}</div>`}
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('.close').onclick=()=>overlay.remove();
  overlay.onclick=(e)=>{if(e.target===overlay) overlay.remove();};
}
</script>
</body>
